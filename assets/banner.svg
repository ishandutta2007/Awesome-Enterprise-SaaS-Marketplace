<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="320" fill="none" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070a13"/><stop offset="50%" stop-color="#0c1326"/><stop offset="100%" stop-color="#0a0f1d"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glow-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtle-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatReverse{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes beacon{0%{r:4;opacity:1}50%{r:9;opacity:.4}}.bg-pulse{animation:pulseGlow 8s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:8,8;animation:dashFlow 20s linear infinite}.flow-fast{stroke-dasharray:6,6;animation:dashFlow 12s linear infinite}.node-float-1{animation:floatSlow 6s ease-in-out infinite}.node-float-2{animation:floatReverse 7s ease-in-out infinite}.beacon-point{animation:beacon 3s ease-in-out infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400}.badge-text{font-weight:600;font-size:11px}</style></defs><rect width="1200" height="320" fill="url(#bg-grad)" rx="16"/><g class="bg-pulse"><circle cx="200" cy="80" r="140" fill="#6366f1" filter="url(#glow)" opacity=".3"/><circle cx="1000" cy="240" r="160" fill="#0ea5e9" filter="url(#glow)" opacity=".25"/><circle cx="600" cy="160" r="200" fill="#8b5cf6" filter="url(#glow)" opacity=".15"/></g><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 50 160 Q 250 40 450 160 T 850 160 T 1150 160" class="flow-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 100 240 C 300 280, 500 120, 750 200 C 950 260, 1050 100, 1150 120" class="flow-fast"/><path fill="none" stroke="#6366f1" stroke-width="1.2" d="M 80 80 C 280 20, 520 220, 800 100 C 980 20, 1080 180, 1160 220" class="flow-line"/></g><g class="node-float-1" opacity=".6"><circle cx="140" cy="70" r="5" fill="#38bdf8"/><circle cx="140" cy="70" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon-point"/><circle cx="1060" cy="90" r="5" fill="#c084fc"/><circle cx="1060" cy="90" r="10" fill="none" stroke="#c084fc" stroke-width="1.5" class="beacon-point"/><circle cx="1120" cy="240" r="4" fill="#38bdf8"/><circle cx="80" cy="250" r="4" fill="#818cf8"/></g><g class="node-float-2" opacity=".5"><circle cx="280" cy="260" r="4" fill="#60a5fa"/><circle cx="920" cy="60" r="5" fill="#a78bfa"/></g><g filter="url(#subtle-shadow)" transform="translate(600, 55)"><rect width="340" height="28" x="-170" y="-14" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="14"/><text x="0" y="4" fill="#38bdf8" class="badge-text" letter-spacing="1" text-anchor="middle">⚡ THE DEFINITIVE ENTERPRISE ECOSYSTEM</text></g><text x="600" y="128" fill="#fff" class="title-text" filter="url(#subtle-shadow)" font-size="40" text-anchor="middle">Awesome Enterprise SaaS Marketplace</text><rect width="360" height="3" x="420" y="145" fill="url(#primary-grad)" rx="1.5"/><text x="600" y="185" fill="#94a3b8" class="subtitle-text" font-size="16" text-anchor="middle">Curated Hub of Cloud Hyperscalers, App Stores, Extension Registries &amp; Open Infrastructure</text><g><g transform="translate(600, 245) translate(-410, 0)"><rect width="195" height="36" x="0" y="0" fill="url(#card-grad)" stroke="#334155" stroke-width="1" rx="8"/><text x="97" y="22" fill="#e2e8f0" class="badge-text" text-anchor="middle">☁️ Cloud Hyperscalers</text></g><g transform="translate(600, 245) translate(-195, 0)"><rect width="185" height="36" x="0" y="0" fill="url(#card-grad)" stroke="#334155" stroke-width="1" rx="8"/><text x="92" y="22" fill="#e2e8f0" class="badge-text" text-anchor="middle">🛍️ SaaS App Stores</text></g><g transform="translate(600, 245) translate(10, 0)"><rect width="195" height="36" x="0" y="0" fill="url(#card-grad)" stroke="#334155" stroke-width="1" rx="8"/><text x="97" y="22" fill="#e2e8f0" class="badge-text" text-anchor="middle">🔌 Extension Registries</text></g><g transform="translate(600, 245) translate(225, 0)"><rect width="185" height="36" x="0" y="0" fill="url(#card-grad)" stroke="#334155" stroke-width="1" rx="8"/><text x="92" y="22" fill="#e2e8f0" class="badge-text" text-anchor="middle">🚀 Open Infrastructure</text></g></g><rect width="1198" height="318" x="1" y="1" stroke="url(#primary-grad)" stroke-opacity=".35" stroke-width="1" rx="15"/></svg>