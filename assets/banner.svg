<svg width="100%" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0c1326"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -100; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes beacon {
        0%, 100% { r: 4; opacity: 1; }
        50% { r: 9; opacity: 0.4; }
      }

      .bg-pulse {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dashFlow 20s linear infinite;
      }
      .flow-fast {
        stroke-dasharray: 6, 6;
        animation: dashFlow 12s linear infinite;
      }
      .node-float-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .node-float-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .beacon-point {
        animation: beacon 3s ease-in-out infinite;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- 1. Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- 2. Dynamic Ambient Glow Orbs (Behind content) -->
  <g class="bg-pulse">
    <circle cx="200" cy="80" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.3"/>
    <circle cx="1000" cy="240" r="160" fill="#0ea5e9" filter="url(#glow)" opacity="0.25"/>
    <circle cx="600" cy="160" r="200" fill="#8b5cf6" filter="url(#glow)" opacity="0.15"/>
  </g>

  <!-- 3. Dynamic Connecting Network Circuit (Marketplace Topology) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 50 160 Q 250 40 450 160 T 850 160 T 1150 160" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <path class="flow-fast" d="M 100 240 C 300 280, 500 120, 750 200 C 950 260, 1050 100, 1150 120" stroke="#a855f7" stroke-width="1.5" fill="none"/>
    <path class="flow-line" d="M 80 80 C 280 20, 520 220, 800 100 C 980 20, 1080 180, 1160 220" stroke="#6366f1" stroke-width="1.2" fill="none"/>
  </g>

  <!-- 4. Floating Dynamic Eco-Nodes (Behind foreground text) -->
  <g class="node-float-1" opacity="0.6">
    <circle cx="140" cy="70" r="5" fill="#38bdf8"/>
    <circle class="beacon-point" cx="140" cy="70" r="10" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    
    <circle cx="1060" cy="90" r="5" fill="#c084fc"/>
    <circle class="beacon-point" cx="1060" cy="90" r="10" stroke="#c084fc" stroke-width="1.5" fill="none"/>

    <circle cx="1120" cy="240" r="4" fill="#38bdf8"/>
    <circle cx="80" cy="250" r="4" fill="#818cf8"/>
  </g>

  <g class="node-float-2" opacity="0.5">
    <circle cx="280" cy="260" r="4" fill="#60a5fa"/>
    <circle cx="920" cy="60" r="5" fill="#a78bfa"/>
  </g>

  <!-- 5. Foreground Content Layer (Protected from occlusion) -->
  
  <!-- Top Category Tag -->
  <g transform="translate(600, 55)" filter="url(#subtle-shadow)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <text class="badge-text" x="0" y="4" text-anchor="middle" fill="#38bdf8" letter-spacing="1">⚡ THE DEFINITIVE ENTERPRISE ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <text class="title-text" x="600" y="128" text-anchor="middle" font-size="40" fill="#ffffff" filter="url(#subtle-shadow)">
    Awesome Enterprise SaaS Marketplace
  </text>
  
  <!-- Gradient Accent Underline -->
  <rect x="420" y="145" width="360" height="3" rx="1.5" fill="url(#primary-grad)"/>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="185" text-anchor="middle" font-size="16" fill="#94a3b8">
    Curated Hub of Cloud Hyperscalers, App Stores, Extension Registries &amp; Open Infrastructure
  </text>

  <!-- 4 Feature Pills in Foreground -->
  <g transform="translate(600, 245)">
    <!-- Pill 1 -->
    <g transform="translate(-410, 0)">
      <rect x="0" y="0" width="195" height="36" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text class="badge-text" x="97" y="22" text-anchor="middle" fill="#e2e8f0">☁️ Cloud Hyperscalers</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="185" height="36" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text class="badge-text" x="92" y="22" text-anchor="middle" fill="#e2e8f0">🛍️ SaaS App Stores</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="195" height="36" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text class="badge-text" x="97" y="22" text-anchor="middle" fill="#e2e8f0">🔌 Extension Registries</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="185" height="36" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text class="badge-text" x="92" y="22" text-anchor="middle" fill="#e2e8f0">🚀 Open Infrastructure</text>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="318" rx="15" stroke="url(#primary-grad)" stroke-width="1" stroke-opacity="0.35"/>
</svg>
